name: Update Deb

on:
  schedule:
    # 00:00, 08:00, and 16:00 UTC. GitHub may start a scheduled run later.
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-deb
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new Epic Games Launcher .deb
        id: deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-deb.py

      - name: Open a pull request
        if: steps.deb.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.deb.outputs.version }}
          HASH: ${{ steps.deb.outputs.hash }}
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/epic-games-launcher.nix
          git commit -m "bump ${VERSION}"

          if git ls-remote --exit-code --heads origin deb-update >/dev/null; then
            git fetch --depth=1 origin deb-update
            git push --force-with-lease="refs/heads/deb-update:refs/remotes/origin/deb-update" \
              origin HEAD:refs/heads/deb-update
          else
            git push origin HEAD:refs/heads/deb-update
          fi

          title="bump ${VERSION}"
          body_file="$RUNNER_TEMP/deb-pr-body.md"
          cat > "$body_file" <<EOF
          Epic republished the Linux launcher .deb.

          - Version: \`${VERSION}\`
          - Hash: \`${HASH}\`

          The scheduled workflow followed the public installer URL and updated \`pkgs/epic-games-launcher.nix\`.
          EOF

          # gh pr view matches a merged pull request with the same head branch.
          # Only edit a pull request that is still open.
          open_pr=$(gh pr list --head deb-update --state open --json number --jq '.[0].number')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title" --body-file "$body_file"
          else
            gh pr create --base "$BASE" --head deb-update --title "$title" --body-file "$body_file"
          fi
